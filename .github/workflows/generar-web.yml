# Regenera las páginas cada vez que se guarda un cambio desde el panel
# (contenido.json) o se modifica scripts/build.py.
name: Generar web

on:
  push:
    branches: [main]
    paths:
      - contenido.json
      - scripts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generar-web
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar páginas desde contenido.json
        run: python scripts/build.py

      - name: Guardar las páginas actualizadas
        run: |
          git config user.name "sync-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "No hubo cambios en las páginas."
          else
            git commit -m "Actualizar páginas desde el panel"
            git push
          fi
