<head>

<meta property="og:title" content="Sync — Agencia de Meta Ads">
<meta property="og:description" content="Campañas de Meta Ads que generan resultados reales. Primera auditoría gratis.">

<meta property="og:url" content="https://TU-DOMINIO.com">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Figtree:wght@400;500;600;700;800;900&family=Alice&display=swap" rel="stylesheet">

<style>
  /* RESETEO GENERAL: Evita márgenes rebeldes del navegador y estandariza el cálculo de tamaños */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* VARIABLES GLOBALES: Centraliza colores para cambiarlos fácil desde acá */
  :root {
    --bg: #120820;
    --bg2: #160b2a;
    --purple-light: #c9b8d4;
    --purple-mid: #9b7fae;
    --purple: #6b3fa0;
    --lime: #c8ff00;
    --white: #ffffff;
    --gray: #a0a0b0;
    --card-bg: #1c1030;
    --input-bg: #1e1535;
    --border: #2e2050;
  }

  /* Hace que el scroll al clickear los enlaces internos sea suave y progresivo */
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Figtree', sans-serif;
    background: var(--bg);
    color: var(--white);
    overflow-x: hidden; /* Evita scrolls horizontales accidentales */
  }

  /* ── NAVBAR (Barra de Navegación) ── */
  nav {
    position: fixed; /* Se queda clavada arriba mientras hacés scroll */
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 60px;
    background: var(--bg);
    transition: background 0.3s, border-bottom 0.3s;
  }

  /* Clase que se activa mediante JavaScript al hacer scroll (efecto vidrio/blur) */
  nav.scrolled {
    background: rgba(18, 8, 32, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 32px rgba(0,0,0,0.3);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.4rem;
    font-weight: 800;
    color: var(--white);
    text-decoration: none;
  }

  .logo svg { width: 32px; height: 32px; }

  .btn-lime {
    background: var(--lime);
    color: #0a0a0a;
    font-family: 'Figtree', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: opacity 0.2s;
  }
  .btn-lime:hover { opacity: 0.88; }

  /* ── HERO (Sección Principal - Escritorio) ── */
  #hero {
    min-height: 100vh;
    padding: 140px 60px 80px;
    display: grid;
    grid-template-columns: 1.2fr 0.8fr; /* Divide la pantalla en dos columnas (Texto | Chat) */
    gap: 48px;
    align-items: center;
  }

  .hero-left {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .hero-left h1 {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(3.6rem, 5.8vw, 6.2rem); /* Escala el tamaño según el ancho de la pantalla */
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -2px;
    margin-bottom: 24px;
  }

  .hero-left h1 span { color: var(--lime); }

  .hero-left p {
    font-size: 1.05rem;
    color: var(--gray);
    line-height: 1.6;
    max-width: 480px;
    margin-bottom: 30px;
  }

  .hero-features {
    list-style: none;
    margin-bottom: 40px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .hero-features li {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 1rem;
    color: var(--gray);
  }

  .hero-features li .icon {
    font-size: 1.1rem;
    width: 24px;
    text-align: center;
    flex-shrink: 0;
  }

  .btn-hero {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: var(--lime);
    color: #0a0a0a;
    font-family: 'Figtree', sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
    padding: 16px 32px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .btn-hero:hover { opacity: 0.88; transform: translateY(-1px); }

  .btn-hero .arrow-circle {
    background: #0a0a0a;
    color: var(--lime);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    line-height: 1;
    flex-shrink: 0;
  }

  /* MAQUETADO DEL CHAT SIMULADO (Aporta prueba analítica visual) */
  .hero-right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 10px 0;
    max-width: 380px;
    justify-self: end;
    opacity: 0.88;
  }

  .chat-container {
    background: #1a1030;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    width: 100%;
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
  }

  .chat-header-icon {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--bg2);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .chat-header-info { display: flex; flex-direction: column; gap: 2px; }
  .chat-header-name { font-weight: 800; font-size: 1rem; color: var(--white); }
  .chat-header-status { font-size: 0.8rem; color: var(--gray); }

  .chat-messages {
    padding: 20px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chat-bubble {
    border-radius: 18px;
    padding: 13px 17px;
    font-size: 0.88rem;
    line-height: 1.5;
    max-width: 90%;
    position: relative;
  }

  .chat-bubble .time {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.45);
    text-align: right;
    margin-top: 6px;
  }

  .bubble-user {
    background: var(--purple-light);
    color: #1a0a30;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }

  .bubble-agent {
    background: #241840;
    color: var(--white);
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    margin-left: auto;
  }

  /* ── SECCIÓN EL PROCESO ── */
  #proceso {
    padding: 100px 60px;
    position: relative;
  }

  .section-label {
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--purple-mid);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .section-label::after {
    content: '';
    display: inline-block;
    width: 60px;
    height: 2px;
    background: var(--purple-mid);
    border-radius: 2px;
  }

  #proceso h2 {
    font-size: clamp(2rem, 4vw, 3.2rem);
    font-weight: 900;
    margin-bottom: 12px;
    margin-top: 12px;
  }

  #proceso .subtitle {
    color: var(--gray);
    font-size: 1rem;
    margin-bottom: 70px;
    max-width: 420px;
    line-height: 1.6;
  }

  .proceso-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr); /* 4 pasos alineados en fila para computadoras */
    gap: 32px;
    position: relative;
  }

  .proceso-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 0;
  }

  .paso-icon-wrap {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 1.5px solid var(--purple);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    background: transparent;
  }

  .paso-icon-wrap svg {
    width: 64px;
    height: 64px;
    stroke: var(--lime);
    fill: none;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .proceso-step h3 {
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--lime);
    margin-bottom: 20px;
  }

  .proceso-step p { font-size: 0.95rem; color: var(--gray); line-height: 1.7; }

  /* ── SECCIÓN FORMULARIO (Objetivo Único de Conversión) ── */
  #contacto {
    padding: 100px 60px;
    display: grid;
    grid-template-columns: 1fr 1fr; /* Columna de Copy persuasivo | Columna de Formulario */
    gap: 80px;
    align-items: start;
  }

  .contacto-left .section-label { margin-bottom: 8px; color: var(--purple-mid); }
  .contacto-left h2 { font-size: clamp(2.8rem, 5vw, 5rem); font-weight: 900; line-height: 1.0; margin: 20px 0 24px; }
  .contacto-left h2 .highlight { color: var(--lime); }
  .contacto-left > p { color: var(--gray); font-size: 0.97rem; line-height: 1.6; margin-bottom: 32px; max-width: 540px; }

  .contacto-checks { list-style: none; display: flex; flex-direction: column; gap: 20px; }
